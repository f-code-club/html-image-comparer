[package]
name = "html-renderer"
version = "1.0.0"
edition = "2024"
license = "MIT"
readme = "README.md"
repository = "https://github.com/f-code-club/html-renderer"
homepage = "https://github.com/f-code-club/html-renderer"
description = """
HTML renderer project written in Rust
"""

[dependencies]
chromiumoxide = "0.9.1"
futures = "0.3.32"
